[package]
name = "shape-value"
version = "0.3.2"
edition = "2024"
description = "NaN-boxed value representation and heap types for Shape"
license = "MIT OR Apache-2.0"
authors = ["Daniel Amesberger"]
repository = "https://github.com/shape-lang/shape"

[dependencies]
shape-ast = { workspace = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rust_decimal = { version = "1.36", features = ["serde-str"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-buffer = { workspace = true }
thiserror = { workspace = true }
ahash = { workspace = true }
smallvec = "1"
parking_lot = { workspace = true }
tokio = { workspace = true }

[features]
default = []
# Cycle-collecting GC (real-gc-cycle-collection.md). Default OFF: with the
# feature off, all GC code compiles to nothing and the build is a strict no-op.
# Phase 0 lands metadata + accessors only (no collector, no barriers, no Drop
# change).
gc = []
# Allocation-seam counters (#194). Default OFF: the counters are test
# instrumentation, and a thread-local increment on every allocation and free is
# measurable on allocation-heavy workloads (~8% on the charter's alloc_tree
# when they were unconditional). Always on inside shape-value's own `cfg(test)`
# build, so the seam's differential tests need no feature flag; this feature is
# for measuring allocation counts from another crate.
alloc-stats = []
