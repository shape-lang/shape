[package]
name = "shape-ast"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AST types and Pest grammar for the Shape programming language"

[features]
default = []
deep-tests = []

[dependencies]
# ADR-017 §4: a located error carries the emitter's machine-applicable
# fixes, so `SourceLocation` names the LSDS `SuggestedFix` type directly
# rather than growing a parallel copy of it. shape-diagnostics is a leaf
# crate (serde only), so this stays acyclic.
shape-diagnostics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
logos = "0.13"
pest = "2.8"
pest_derive = "2.8"
ordered-float = { workspace = true }
rust_decimal = { workspace = true }
