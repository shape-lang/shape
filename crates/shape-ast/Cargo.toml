[package]
name = "shape-ast"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AST types and Pest grammar for the Shape programming language"

[features]
default = []
deep-tests = []

[dependencies]
# ADR-017 §4: a located error carries the emitter's machine-applicable
# fixes, so `SourceLocation` names the LSDS `SuggestedFix` type directly
# rather than growing a parallel copy of it. shape-diagnostics is a leaf
# crate (serde only), so this stays acyclic.
shape-diagnostics = { workspace = true }
# The foreign marshaling table (ADR-019 §1 / #196). `shape-abi-v1` is a
# dependency-free leaf crate, and it is the only crate the compiler, the
# marshal layer and the language-runtime extensions can all see — so the
# declaration-site check reads the table from there instead of restating it.
shape-abi-v1 = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
logos = "0.13"
pest = "2.8"
pest_derive = "2.8"
ordered-float = { workspace = true }
rust_decimal = { workspace = true }
