[package]
name = "shape-ast"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AST types and Pest grammar for the Shape programming language"

[features]
default = []
deep-tests = []

[dependencies]
# The foreign marshaling table (ADR-019 §1 / #196). `shape-abi-v1` is a
# dependency-free leaf crate, and it is the only crate the compiler, the
# marshal layer and the language-runtime extensions can all see — so the
# declaration-site check reads the table from there instead of restating it.
shape-abi-v1 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
logos = "0.13"
pest = "2.8"
pest_derive = "2.8"
ordered-float = { workspace = true }
rust_decimal = { workspace = true }
